version: "2"
run:
  timeout: 5m
  tests: false
  issues-exit-code: 0
linters:
  default: none
  enable:
    - dupl
    - gocognit
    - interfacebloat
    - lll
    - nestif
  exclusions:
    generated: strict
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 20
    interfacebloat:
      max: 10
    lll:
      line-length: 140
    nestif:
      min-complexity: 5

syntax = "proto3";

package shinona.sessions.v1;

option go_package = "github.com/OXeu/shinona/internal/adapter/sessiontransfer/sessionpb";

message SessionSummary {
  string id = 1;
  optional string project_id = 2;
  string title = 3;
  bool default_title = 4;
  int32 turn_count = 5;
  string updated_at = 6;
  bool pinned = 7;
  bool active = 8;
  bool unread = 9;
}

message RunOptions {
  string model = 1;
  string permission = 2;
  string thinking = 3;
  repeated string mcp_servers = 4;
  reserved 5;
  bool arrow_js = 6;
}

message SandboxSettings {
  repeated string available = 1;
  optional string selected = 2;
}

message Turn {
  string id = 1;
  int32 sequence = 2;
  string prompt = 3;
  string status = 4;
  optional string policy = 5;
  string output = 6;
  string created_at = 7;
  optional string started_at = 8;
  string updated_at = 9;
  string model = 10;
  repeated string attachments = 11;
  repeated SteeringMessage steering = 12;
  repeated TurnPart parts = 13;
  int32 context_tokens = 14;
  int32 context_window = 15;
  ContextUsage live_context = 16;
  TokenUsage token_usage = 17;
}

message TokenUsage {
  int32 input = 1;
  int32 cached = 2;
  int32 output = 3;
}

message ContextUsage {
  int32 tokens = 1;
  int32 window = 2;
  bool estimated = 3;
}

message SteeringMessage {
  string text = 1;
  bool delivered = 2;
  string id = 3;
}

message TurnPart {
  string kind = 1;
  string text = 2;
  string tool = 3;
  string input = 4;
  string output = 5;
  string status = 6;
  int32 estimated_tokens = 7;
}

message TranscriptPage {
  // Absent when the session is unavailable to the caller.
  SessionSummary session = 1;
  SandboxSettings sandbox_settings = 2;
  RunOptions last_options = 3;
  int32 next_before_sequence = 4;
  repeated Turn turns = 5;
  // True for a complete page.
  bool complete = 6;
  // The latest started turn when the latest page contains only queued or unstarted turns.
  Turn earlier_turn = 7;
}

// Full exports send unsigned varint-length-prefixed frames. The header comes
// first, followed by turns and exactly one end frame. EOF without an end
// frame means the transport was interrupted.
message TranscriptExportFrame {
  oneof item {
    TranscriptExportHeader header = 1;
    Turn turn = 2;
    TranscriptExportEnd end = 3;
  }
}

message TranscriptExportHeader {
  SessionSummary session = 1;
  SandboxSettings sandbox_settings = 2;
  RunOptions last_options = 3;
  int32 turn_count = 4;
}

message TranscriptExportEnd {
  enum Failure {
    NONE = 0;
    LIMIT = 1;
    TIMEOUT = 2;
    INTERNAL = 3;
  }
  Failure failure = 1;
}

message LiveRequest {
  string session_id = 1;
  repeated TurnVersion known_turns = 2;
  optional bool paged = 3;
  bool include_earlier_turn = 4;
}

message TurnVersion {
  string id = 1;
  string updated_at = 2;
  string status = 3;
}

message LiveMessage {
  uint32 sequence = 1;
  oneof item {
    LiveSync sync = 2;
    LiveProgress progress = 3;
    bool heartbeat = 4;
  }
}

message LiveSync {
  // Absent when the session is archived while the viewer is connected.
  SessionSummary session = 1;
  SandboxSettings sandbox_settings = 2;
  repeated string turn_ids = 3;
  repeated Turn changed_turns = 4;
  RunOptions last_options = 5;
  int32 next_before_sequence = 6;
  // Outside turn_ids and the cursor range. Its body follows the same version rules as the page.
  string earlier_turn_id = 7;
}

message LiveProgress {
  string turn_id = 1;
  uint32 part_count = 2;
  repeated LivePartChange parts = 3;
  LiveSteering steering = 4;
  ContextUsage context = 5;
}

message LiveSteering {
  repeated SteeringMessage messages = 1;
}

message LivePartChange {
  uint32 index = 1;
  oneof item {
    TurnPart replace = 2;
    LivePartAppend append = 3;
  }
}

message LivePartAppend {
  string text = 1;
  string output = 2;
  int32 estimated_tokens = 3;
}

schema {
  query: Query
  mutation: Mutation
}

type Query {
  mode: String!
  composerOptions: ComposerOptions!
  applicationSettings: [SettingField!]!
  modelSettings: [SettingField!]!
  mcpSettings: McpSettings!
  projects: [Project!]!
  # Omit projectId for all projects. An empty ID selects the default project.
  sessions(projectId: ID): [SessionSummary!]!
  session(id: ID!): AgentSession
  sandboxSettings: SandboxSettings!
  workspaceChanges(sessionId: ID!): WorkspaceChanges!
  workspaceHistory(sessionId: ID!): WorkspaceHistory!
  workspaceDirectory(sessionId: ID!, path: String!): WorkspaceDirectory!
  workspacePreview(sessionId: ID!, path: String!, diff: Boolean!, revision: String): WorkspacePreview!
}

type Mutation {
  saveMcpServer(input: McpServerInput!): McpSettings!
  removeMcpServer(name: String!): McpSettings!
  resetMcpSettings: McpSettings!
  updateApplicationSettings(changes: [SettingChange!]!): [SettingField!]!
  updateModelSettings(changes: [SettingChange!]!): [SettingField!]!
  createProject(name: String!): Project!
  renameProject(id: ID!, name: String!): Project!
  removeProject(id: ID!): Boolean!
  createSession(projectId: ID): SessionSummary!
  updateSession(id: ID!, title: String, pinned: Boolean): SessionSummary!
  archiveSession(id: ID!): Boolean!
  markSessionRead(id: ID!, through: Int!, throughId: ID): Boolean!
  revertTurn(sessionId: ID!, turnId: ID!, expectedHeadId: ID!): RevertedTurn!
  submitRun(sessionId: ID!, prompt: String!, payload: RunPayloadInput, queue: Boolean): Run!
  retryTurn(sessionId: ID!, turnId: ID!, model: String, options: RetryOptionsInput): Run!
  steerRun(sessionId: ID!, runId: ID!, prompt: String!): Boolean!
  stopRun(sessionId: ID!, runId: ID!): Boolean!
  fetchModels(baseUrl: String, apiKey: String): [ModelInfo!]!
  setSandboxPolicy(policy: SandboxPolicy!): SandboxSettings!
  setComposerDefaults(input: ComposerDefaultsInput!): ComposerDefaults!
  commitWorkspace(sessionId: ID!, message: String!, paths: [String!]!): String!
}

type WorkspaceChanges {
  branch: String!
  entries: [WorkspaceChange!]!
  truncated: Boolean!
}

type WorkspaceChange {
  path: String!
  status: String!
  untracked: Boolean!
}

type WorkspaceHistory {
  entries: [WorkspaceCommit!]!
  truncated: Boolean!
}

type WorkspaceCommit {
  hash: String!
  short: String!
  author: String!
  date: String!
  subject: String!
}

type WorkspaceDirectory {
  entries: [WorkspaceEntry!]!
  truncated: Boolean!
}

type WorkspaceEntry {
  path: String!
  name: String!
  directory: Boolean!
}

type WorkspacePreview {
  text: String!
  truncated: Boolean!
}

enum RunStatus {
  QUEUED
  RUNNING
  SUCCEEDED
  FAILED
  STOPPED
}

enum SandboxPolicy {
  FRESH
  SHARED
}

type SandboxSettings {
  available: [SandboxPolicy!]!
  selected: SandboxPolicy
}

type Project {
  id: ID!
  name: String!
}

type SessionSummary {
  id: ID!
  projectId: ID
  title: String!
  defaultTitle: Boolean!
  turnCount: Int!
  updatedAt: String!
  pinned: Boolean!
  active: Boolean!
  unread: Boolean!
}

type AgentSession {
  id: ID!
  projectId: ID
  title: String!
  defaultTitle: Boolean!
  turnCount: Int!
  updatedAt: String!
  pinned: Boolean!
  active: Boolean!
  unread: Boolean!
  turns: [Run!]!
  lastOptions: RunOptions
}

type RunOptions {
  model: String!
  permission: String!
  thinking: String!
  mcpServers: [String!]!
  jsonRender: Boolean!
}

type Run {
  id: ID!
  sequence: Int!
  prompt: String!
  status: RunStatus!
  policy: SandboxPolicy
  output: String!
  parts: [TurnPart!]!
  model: String!
  attachments: [String!]!
  steering: [SteeringMessage!]!
  contextTokens: Int!
  contextWindow: Int!
  tokenUsage: TokenUsage
  liveContext: ContextUsage
  createdAt: String!
  startedAt: String
  updatedAt: String!
}

type TokenUsage {
  input: Int!
  cached: Int!
  output: Int!
}

type ContextUsage {
  tokens: Int!
  window: Int!
  estimated: Boolean!
}

type RevertedTurn {
  session: SessionSummary!
  prompt: String!
  images: [DraftImage!]!
}

type DraftImage {
  name: String!
  mediaType: String!
  data: String!
}

type TurnPart {
  kind: String!
  text: String!
  tool: String!
  input: String!
  output: String!
  status: String!
  estimatedTokens: Int!
}

type SettingField {
  key: String!
  value: String
  configured: Boolean!
  overridden: Boolean!
}

input SettingChange {
  key: String!
  value: String
}

type ModelInfo {
  id: String!
  contextWindow: Int!
}

type ComposerOptions {
  defaultModel: String!
  models: [ModelInfo!]!
  modelsLoading: Boolean!
  mcpServers: [String!]!
  defaults: ComposerDefaults
}

type ComposerDefaults {
  model: String!
  permission: String!
  thinking: String!
}

input ComposerDefaultsInput {
  model: String!
  permission: String!
  thinking: String!
}

type SteeringMessage {
  text: String!
  delivered: Boolean!
}

input ImageInput {
  name: String!
  mediaType: String!
  data: String!
}

input RunPayloadInput {
  images: [ImageInput!]
  model: String
  permission: String
  thinking: String
  mcp: String
  mcpServers: [String!]
  jsonRender: Boolean
}

input RetryOptionsInput {
  model: String!
  permission: String!
  thinking: String!
  mcpServers: [String!]!
  jsonRender: Boolean
}

type McpSettings {
  servers: [McpServer!]!
  overridden: Boolean!
}

type McpServer {
  name: String!
  url: String!
  hasToken: Boolean!
  oauth: Boolean!
  connected: Boolean!
}

input McpServerInput {
  previousName: String
  name: String!
  url: String!
  token: String
  oauth: Boolean
}

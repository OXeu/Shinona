version: "2"
run:
  timeout: 5m
linters:
  default: standard
  exclusions:
    rules:
      # Repository tests run the real git binary to verify directory scoping.
      # The no-host-shell guard still applies to every production file.
      - path: (^|/)internal/workspace/.*_test\.go$
        linters:
          - depguard
        text: os/exec
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - unconvert
  settings:
    depguard:
      rules:
        domain:
          list-mode: strict
          files:
            - "**/internal/auth/*.go"
            - "**/internal/auth/**/*.go"
            - "**/internal/run/*.go"
            - "**/internal/run/**/*.go"
            - "**/internal/sandbox/*.go"
            - "**/internal/sandbox/**/*.go"
          allow:
            - $gostd
            - github.com/OXeu/shinona/internal/sandbox$
            - github.com/OXeu/shinona/internal/timing$
        no-host-shell:
          files:
            - $all
          deny:
            - pkg: os/exec$
              desc: Commands belong in a sandbox adapter.
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
formatters:
  enable:
    - gofmt

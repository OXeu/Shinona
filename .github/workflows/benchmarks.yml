name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2b:
        description: Run live E2B benchmarks with the dedicated benchmark credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare benchmark directory
        run: |
          mkdir -p .tmp
          find -P .tmp -mindepth 1 -depth ! -type d -amin +120 -mmin +120 -delete
          find -P .tmp -mindepth 1 -depth -type d -empty -amin +120 -mmin +120 -delete
          for name in TMPDIR TMP TEMP GOTMPDIR; do
            printf '%s=%s/.tmp\n' "$name" "$GITHUB_WORKSPACE"
          done >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run core API and compression benchmarks
        run: |
          set -o pipefail
          go test -p 1 -cpu 2 -run '^$' \
            -bench '^Benchmark(CoreAPI|ZstdTranscriptEncoding)$' -benchmem -benchtime=1s -count=1 \
            ./cmd/shinona ./internal/adapter/httpserver | tee .tmp/go-bench.txt
      - name: Run live SSH sandbox API benchmarks
        run: |
          set -o pipefail
          if ! command -v sshd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          # Ubuntu's OpenSSH requires this directory even for a separate daemon.
          sudo install -d -o root -g root -m 0755 /run/sshd
          bash .github/scripts/benchmark-ssh.sh bash -e -c '
            go test -p 1 -cpu 2 -run "^\$" -bench "^BenchmarkSandboxAPI\$/^ssh\$/^(FileList|GitChanges|GitHistory|WorkspacePreview|PTYRoundTrip)\$" \
              -benchmem -benchtime=1s -count=1 ./cmd/shinona
            go test -p 1 -cpu 2 -run "^\$" -bench "^BenchmarkSandboxAPI\$/^ssh\$/^(Initialize|Recreate|Destroy|WorkspaceCommit|TerminalCreate)\$" \
              -benchmem -benchtime=5x -count=1 ./cmd/shinona
          ' | tee -a .tmp/go-bench.txt
      - name: Build web assets and measure session hot paths
        working-directory: web
        run: |
          npm ci
          npm run build -- --manifest
          node bench/bundle-sizes.js > ../.tmp/web-sizes.json
          node --experimental-transform-types bench/session-paths.js > ../.tmp/web-bench.json
      - name: Convert Go and web measurements to BMF v1
        run: |
          python3 .github/scripts/benchmark-metrics.py go .tmp/go-bench.txt > .tmp/go-bench.json
          jq -s 'add | map_values([{parameters: {}, measures: .}])' \
            .tmp/go-bench.json .tmp/web-sizes.json .tmp/web-bench.json > .tmp/benchmarks.json
      - uses: actions/upload-artifact@v7
        with:
          name: go-bench
          path: |
            .tmp/go-bench.txt
            .tmp/go-bench.json
            .tmp/web-sizes.json
            .tmp/web-bench.json
            .tmp/benchmarks.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Run core load variants
        id: core-read-load
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          SHINONA_BENCH_LOAD_OUTPUT="$GITHUB_WORKSPACE/.tmp/core-read-load.json" \
            go test -p 1 -count=1 -run '^TestCoreReadLoad$' -v ./cmd/shinona | tee .tmp/core-read-load.txt
          echo "ended_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/benchmark-metrics.py check-load --linux .tmp/core-read-load.json
      - uses: actions/upload-artifact@v7
        with:
          name: core-read-load
          path: |
            .tmp/core-read-load.json
            .tmp/core-read-load.txt
          include-hidden-files: true
          if-no-files-found: error
      - uses: bencherdev/bencher@b2484bc6734c8e6da4fad141bd13527a11da3988 # v0.6.17
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      - name: Register Bencher measures with units
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [[ -n "$BENCHER_API_KEY" ]]; then
            bash .github/scripts/benchmark-measures.sh
          fi
      - name: Publish to Bencher
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish benchmark results."
            exit 0
          fi

          branch="$GITHUB_REF_NAME"
          options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            branch="pr-$PR_NUMBER"
            options+=(--start-point "$GITHUB_BASE_REF" --ci-number "$PR_NUMBER")
          fi

          thresholds=()
          for criterion in wire-bytes-per-op:0.05 alloc-bytes-per-op:0.15 allocs-per-op:0.10 gzip-bytes:0.03; do
            thresholds+=(--threshold-measure "${criterion%:*}" --threshold-metric value --threshold-test percentage
              --threshold-min-sample-size 5 --threshold-max-sample-size 20
              --threshold-upper-boundary "${criterion#*:}")
          done
          thresholds+=(--threshold-measure latency --threshold-metric value --threshold-test t_test
            --threshold-min-sample-size 5 --threshold-max-sample-size 20 --threshold-upper-boundary 0.99)

          # The CLI's json adapter follows the project's BMF version.
          bencher run --project shinona --branch "$branch" --hash "$BENCHMARK_SHA" \
            --testbed github-ubuntu-24.04-x64 --adapter json --file .tmp/benchmarks.json \
            --github-actions "$GITHUB_TOKEN" "${thresholds[@]}" "${options[@]}"
      - name: Publish core load variants to Bencher
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.core-read-load.outputs.started_at }}
          ENDED_AT: ${{ steps.core-read-load.outputs.ended_at }}
        run: |
          set -o pipefail
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish load variants."
            exit 0
          fi

          branch="$GITHUB_REF_NAME"
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            branch="pr-$PR_NUMBER"
            base="$GITHUB_BASE_REF"
          fi

          # Select BMF v1 explicitly so the report preserves named percentiles.
          if ! jq -n --arg branch "$branch" --arg base "$base" --arg hash "$BENCHMARK_SHA" \
            --arg start "$STARTED_AT" --arg end "$ENDED_AT" --rawfile results .tmp/core-read-load.json '
              {bmf_version: 1, branch: $branch, hash: $hash, testbed: "github-ubuntu-24.04-x64",
               start_time: $start, end_time: $end, settings: {adapter: "json_v1"}, results: [$results]}
              + (if $base == "" then {} else {start_point: {branch: $base}} end)
            ' | curl --silent --show-error --fail-with-body --max-time 60 \
              -H "Authorization: Bearer $BENCHER_API_KEY" -H 'Content-Type: application/json' \
              --data-binary @- https://api.bencher.dev/v0/projects/shinona/reports > .tmp/bencher-load-response.json; then
            cat .tmp/bencher-load-response.json >&2
            exit 1
          fi
          report_uuid=$(python3 .github/scripts/benchmark-metrics.py check-load --linux \
            --published .tmp/bencher-load-response.json .tmp/core-read-load.json)
          echo "Benchmarked load variants: https://bencher.dev/console/projects/shinona/reports/$report_uuid"
      - name: Run live E2B sandbox API benchmarks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        env:
          SHINONA_BENCH_E2B_API_KEY: ${{ secrets.SHINONA_BENCH_E2B_API_KEY }}
          SHINONA_BENCH_E2B_TEMPLATE: ${{ vars.SHINONA_BENCH_E2B_TEMPLATE }}
        run: |
          set -o pipefail
          : "${SHINONA_BENCH_E2B_API_KEY:?Set the dedicated E2B benchmark API key secret}"
          : "${SHINONA_BENCH_E2B_TEMPLATE:?Set the E2B benchmark template variable}"
          go test -p 1 -cpu 2 -run '^$' \
            -bench '^BenchmarkSandboxAPI$/^e2b$' -benchmem -benchtime=5x -count=1 \
            ./cmd/shinona | tee .tmp/go-bench-e2b.txt
          python3 .github/scripts/benchmark-metrics.py go .tmp/go-bench-e2b.txt |
            jq 'map_values([{parameters: {}, measures: .}])' > .tmp/go-bench-e2b.json
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        with:
          name: go-bench-e2b
          path: |
            .tmp/go-bench-e2b.txt
            .tmp/go-bench-e2b.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish E2B results to Bencher
        if: github.repository == 'OXeu/Shinona' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish benchmark results."
            exit 0
          fi
          bencher run --project shinona --branch "$GITHUB_REF_NAME" --hash "$GITHUB_SHA" \
            --testbed github-ubuntu-24.04-x64-e2b --adapter json --file .tmp/go-bench-e2b.json

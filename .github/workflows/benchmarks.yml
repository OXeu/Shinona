name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2b:
        description: Run live E2B benchmarks with the dedicated benchmark credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare benchmark directory
        run: |
          mkdir -p .tmp
          for name in TMPDIR TMP TEMP GOTMPDIR; do
            printf '%s=%s/.tmp\n' "$name" "$GITHUB_WORKSPACE"
          done >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run core API benchmarks
        run: |
          set -o pipefail
          go test -p 1 -cpu 2 -run '^$' \
            -bench '^BenchmarkCoreAPI$' -benchmem -benchtime=500ms -count=1 \
            ./cmd/shinona | tee .tmp/go-bench.txt
      - name: Run live SSH sandbox API benchmarks
        run: |
          set -o pipefail
          if ! command -v sshd >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssh-server
          fi
          # Ubuntu's OpenSSH requires this directory even for a separate daemon.
          sudo install -d -o root -g root -m 0755 /run/sshd
          bash .github/scripts/benchmark-ssh.sh bash -e -c '
            go test -p 1 -cpu 2 -run "^\$" -bench "^BenchmarkSandboxAPI\$/^ssh\$/^(FileList|GitChanges|GitHistory|PTYRoundTrip)\$" \
              -benchmem -benchtime=500ms -count=1 ./cmd/shinona
            go test -p 1 -cpu 2 -run "^\$" -bench "^BenchmarkSandboxAPI\$/^ssh\$/^(Initialize|Recreate|Destroy)\$" \
              -benchmem -benchtime=5x -count=1 ./cmd/shinona
          ' | tee -a .tmp/go-bench.txt
      - uses: actions/upload-artifact@v7
        with:
          name: go-bench
          path: .tmp/go-bench.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Run core read load variants
        id: core-read-load
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          echo "started_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          SHINONA_BENCH_LOAD_OUTPUT="$GITHUB_WORKSPACE/.tmp/core-read-load.json" \
            go test -p 1 -count=1 -run '^TestCoreReadLoad$' -v ./cmd/shinona | tee .tmp/core-read-load.txt
          echo "ended_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: core-read-load
          path: |
            .tmp/core-read-load.json
            .tmp/core-read-load.txt
          include-hidden-files: true
          if-no-files-found: error
      - uses: bencherdev/bencher@b2484bc6734c8e6da4fad141bd13527a11da3988 # v0.6.17
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      - name: Publish to Bencher
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish benchmark results."
            exit 0
          fi

          branch="$GITHUB_REF_NAME"
          options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            branch="pr-$PR_NUMBER"
            options+=(--start-point "$GITHUB_BASE_REF" --ci-number "$PR_NUMBER")
          fi

          bencher run --project shinona --branch "$branch" --hash "$BENCHMARK_SHA" \
            --testbed github-ubuntu-24.04-x64 --adapter go_bench --file .tmp/go-bench.txt \
            --github-actions "$GITHUB_TOKEN" "${options[@]}"
      - name: Publish core read load variants to Bencher
        if: github.repository == 'OXeu/Shinona' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
          BENCHMARK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STARTED_AT: ${{ steps.core-read-load.outputs.started_at }}
          ENDED_AT: ${{ steps.core-read-load.outputs.ended_at }}
        run: |
          set -o pipefail
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish load variants."
            exit 0
          fi

          branch="$GITHUB_REF_NAME"
          base=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            branch="pr-$PR_NUMBER"
            base="$GITHUB_BASE_REF"
          fi

          # The REST API can select BMF v1 per report on a project whose default is v0.
          if ! report=$(jq -n --arg branch "$branch" --arg base "$base" --arg hash "$BENCHMARK_SHA" \
            --arg start "$STARTED_AT" --arg end "$ENDED_AT" --rawfile results .tmp/core-read-load.json '
              {bmf_version: 1, branch: $branch, hash: $hash, testbed: "github-ubuntu-24.04-x64",
               start_time: $start, end_time: $end, settings: {adapter: "json_v1"}, results: [$results]}
              + (if $base == "" then {} else {start_point: {branch: $base}} end)
            ' | curl --silent --show-error --fail-with-body --max-time 60 \
              -H "Authorization: Bearer $BENCHER_API_KEY" -H 'Content-Type: application/json' \
              --data-binary @- https://api.bencher.dev/v0/projects/shinona/reports); then
            printf '%s\n' "$report" >&2
            exit 1
          fi
          expected=$(jq '[.[] | length] | add' .tmp/core-read-load.json)
          report_uuid=$(jq -er --argjson expected "$expected" '
            if .bmf_version == 1 and .parse_outcome == "parsed" and $expected > 0
              and (.results[0] | length) == $expected
              and all(.results[0][]; .variant.parameters.concurrency > 0 and (.measures | length) == 2)
            then .uuid // error("The read load report has no UUID")
            else error("Bencher did not parse all read load variants") end
          ' <<< "$report")
          echo "Benchmarked $expected read variants: https://bencher.dev/console/projects/shinona/reports/$report_uuid"
      - name: Run live E2B sandbox API benchmarks
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        env:
          SHINONA_BENCH_E2B_API_KEY: ${{ secrets.SHINONA_BENCH_E2B_API_KEY }}
          SHINONA_BENCH_E2B_TEMPLATE: ${{ vars.SHINONA_BENCH_E2B_TEMPLATE }}
        run: |
          set -o pipefail
          : "${SHINONA_BENCH_E2B_API_KEY:?Set the dedicated E2B benchmark API key secret}"
          : "${SHINONA_BENCH_E2B_TEMPLATE:?Set the E2B benchmark template variable}"
          go test -p 1 -cpu 2 -run '^$' \
            -bench '^BenchmarkSandboxAPI$/^e2b$' -benchmem -benchtime=5x -count=1 \
            ./cmd/shinona | tee .tmp/go-bench-e2b.txt
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        with:
          name: go-bench-e2b
          path: .tmp/go-bench-e2b.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish E2B results to Bencher
        if: github.repository == 'OXeu/Shinona' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.e2b
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          if [[ -z "$BENCHER_API_KEY" ]]; then
            echo "::warning::Set the BENCHER_API_KEY repository secret to publish benchmark results."
            exit 0
          fi
          bencher run --project shinona --branch "$GITHUB_REF_NAME" --hash "$GITHUB_SHA" \
            --testbed github-ubuntu-24.04-x64-e2b --adapter go_bench --file .tmp/go-bench-e2b.txt
